<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase · Barnyard Reaper</title>
<style>
/* Showcase: every model and icon of the game, browsed by category, viewed large and saved as transparent PNGs.
   Layout: categories on the left, thumbnails in the middle, the viewer on the right. */
:root { --bg: #15110f; --panel: #201a17; --panel2: #2a221e; --line: #3a302a; --text: #efe6d4; --dim: #a99a84; --accent: #f2c04e; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 18px; margin: 0; color: var(--accent); }
header .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-left: auto; font-size: 13px; color: var(--dim); }
label.o { display: inline-flex; align-items: center; gap: 6px; }
input, select, button { font: inherit; color: var(--text); background: #120e0c; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
button { cursor: pointer; background: #2e241f; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: #8f2219; border-color: #c2382b; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
main { display: grid; grid-template-columns: 190px minmax(0, 1fr) minmax(320px, 440px); min-height: 0; }
nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 8px; display: grid; align-content: start; gap: 2px; }
nav button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 4px; display: flex; justify-content: space-between; gap: 8px; }
nav button.on { background: var(--panel2); color: var(--accent); }
nav small { color: var(--dim); }
#grid-wrap { overflow-y: auto; padding: 12px; min-height: 0; }
#search { width: 100%; margin-bottom: 10px; }
#note { color: var(--dim); font-size: 12.5px; margin: 0 0 10px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.cell { display: grid; gap: 4px; justify-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; text-align: center; }
.cell:hover, .cell:focus-visible { border-color: var(--accent); outline: none; }
.cell.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cell .th { width: 104px; height: 104px; display: grid; place-items: center; border-radius: 4px; background: var(--checker); overflow: hidden; }
.cell img { display: block; max-width: 104px; max-height: 104px; image-rendering: pixelated; }
.cell span { font-size: 12px; line-height: 1.2; color: var(--text); overflow-wrap: anywhere; }
/* a checkerboard behind everything transparent, so the empty background shows as empty */
:root { --checker: repeating-conic-gradient(#2a2420 0% 25%, #1e1916 0% 50%) 50% / 16px 16px; }
aside { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; background: var(--panel); }
aside h2 { margin: 0; padding: 12px 14px 2px; font-size: 16px; color: var(--accent); overflow-wrap: anywhere; }
#v-sub { margin: 0; padding: 0 14px 8px; color: var(--dim); font-size: 12.5px; }
#stage { position: relative; margin: 0 12px; border-radius: 6px; background: var(--checker); min-height: 260px; overflow: hidden; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; }
#view.px { image-rendering: pixelated; }
#icon-view { position: absolute; inset: 0; display: grid; place-items: center; }
#icon-view img { width: 70%; max-width: 256px; image-rendering: pixelated; }
.vopts { display: grid; gap: 8px; padding: 12px 14px 14px; }
.vopts .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#status { color: var(--dim); font-size: 12.5px; min-height: 1.4em; }
#loading { padding: 40px; color: var(--dim); grid-column: 1 / -1; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: auto; } nav { display: flex; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); } aside { border-left: 0; border-top: 1px solid var(--line); } #stage { height: 300px; } }
</style>
</head>
<body>
<header>
  <h1>Showcase</h1>
  <span style="color:var(--dim)">Every model and icon of Barnyard Reaper. Click one to view it; drag to turn it, scroll to zoom. Saved PNGs have no background.</span>
  <div class="opts">
    <label class="o">PNG size <select id="o-size"><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select></label>
    <label class="o" title="Render at a quarter of the size and scale it up without smoothing, like the game's chunky pixels"><input type="checkbox" id="o-px"> Game pixels</label>
    <label class="o" title="Cut away the empty border around the model"><input type="checkbox" id="o-trim" checked> Trim</label>
  </div>
</header>
<main>
  <nav id="cats"></nav>
  <div id="grid-wrap">
    <input id="search" type="search" placeholder="Filter by name…" aria-label="Filter by name">
    <p id="note"></p>
    <div id="grid"><p id="loading">Loading the game's data…</p></div>
  </div>
  <aside>
    <h2 id="v-name">Pick something</h2>
    <p id="v-sub"></p>
    <div id="stage"><canvas id="view"></canvas><div id="icon-view" hidden><img id="icon-img" alt=""></div></div>
    <div class="vopts">
      <div class="row" id="v-extra"></div>
      <div class="row">
        <button id="b-reset">Reset view</button>
        <label class="o"><input type="checkbox" id="o-spin" checked> Turn slowly</label>
      </div>
      <div class="row">
        <button class="primary" id="b-png" disabled>Download PNG</button>
        <button id="b-all" disabled>Download this section (.zip)</button>
      </div>
      <div id="status"></div>
    </div>
  </aside>
</main>
